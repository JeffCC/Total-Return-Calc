<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>台股總報酬比較 v2 (即時查詢)</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/style_v2.css" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
<header>
  <h1>台股總報酬比較 v2<span class="sub">即時下載 · 含息 / 含配股 / 含分割 / 含減資</span></h1>
  <div class="updated" id="status">就緒</div>
</header>

<section class="controls">
  <div class="panel">
    <label class="label">標的 (1~10 檔，上市 / 上櫃 / ETF)</label>
    <div class="ticker-row">
      <input id="ticker-input" type="text" placeholder="輸入代碼或名稱，Enter 加入…" autocomplete="off" />
      <div id="ticker-suggest" class="suggest hidden"></div>
    </div>
    <div id="selected-tickers" class="chips"></div>
  </div>

  <div class="panel">
    <label class="label">基準 (選配)</label>
    <label class="check"><input type="checkbox" id="bench-0050" /> <span>0050 元大台灣50</span></label>
    <label class="check"><input type="checkbox" id="bench-IR0001" /> <span>IR0001 加權報酬指數</span></label>
  </div>

  <div class="panel">
    <label class="label">區間</label>
    <div class="range-buttons">
      <button data-range="1M">1M</button>
      <button data-range="3M">3M</button>
      <button data-range="6M">6M</button>
      <button data-range="YTD">YTD</button>
      <button data-range="1Y" class="active">1Y</button>
      <button data-range="3Y">3Y</button>
      <button data-range="5Y">5Y</button>
      <button data-range="10Y">10Y</button>
    </div>
    <div class="custom-range">
      <input type="date" id="custom-start" />
      <span>～</span>
      <input type="date" id="custom-end" />
      <button id="custom-apply">自訂</button>
    </div>
  </div>
</section>

<section class="query-bar">
  <button id="run" class="primary">查詢</button>
  <span id="hint" class="hint"></span>
</section>

<section class="chart-wrap">
  <div id="chart"></div>
</section>

<section class="summary">
  <table id="summary-table">
    <thead>
      <tr>
        <th>標的</th><th>市場</th>
        <th>起點</th><th>終點</th><th>天數</th>
        <th>含息報酬</th><th>純價格報酬</th><th>年化(含息)</th><th>區間除權息</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<section class="history">
  <div class="history-head">
    <h2>查詢歷史</h2>
    <input id="history-filter" type="text" placeholder="篩選：代碼 / 名稱 / 備註…" />
  </div>
  <div id="history-pinned"></div>
  <div id="history-list"></div>
</section>

<footer>
  <small>查詢時才即時下載該標的資料 (FinMind；股價失敗時改用 TWSE / TPEX 官方)，並快取於 data_v2/cache/。
  含息計算採用後復權因子法 (factor = 除權息前收盤 / 除權息參考價)，涵蓋現金股利、股票股利、現金增資 (假設必認)、
  股票分割與減資。歷史紀錄存於 data_v2/history.json。</small>
</footer>

<script src="js/calc.js"></script>
<script src="js/chart.js"></script>
<script src="js/main_v2.js"></script>
</body>
</html>
